[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gcw-pipeline"
version = "0.1.0"
description = "Reproducible Green Carbon Wealth data pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "lxml>=5.0",
  "pyogrio>=0.10",
  "rasterio>=1.4",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyterlab>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
