<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Country-level forest and marine carbon accounts, combined into Natural Carbon Wealth (NCW), with forest capacity loss and climate-finance scenarios." />
    <link rel="canonical" href="https://aurvl.github.io/ncw/" />
    <meta name="google-site-verification" content="cu2E8FQvuOjOSFhsa6-XD2SlZhCFnDclAQrdutOqR3A" />
    <title>Natural Carbon Wealth Explorer</title>
    <script>
      // Theme before first paint: a choice made with the toggle wins; otherwise light from
      // 06:00 to 20:59 local time and dark outside those hours.
      var h = new Date().getHours();
      var t = h >= 6 && h < 21 ? 'light' : 'dark';
      try {
        var stored = localStorage.getItem('ncw-theme');
        if (stored === 'light' || stored === 'dark') t = stored;
      } catch (e) { /* storage unavailable: keep the time-based theme */ }
      document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
